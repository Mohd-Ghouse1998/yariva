services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: aroha
      POSTGRES_PASSWORD: aroha
      POSTGRES_DB: aroha_live
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aroha -d aroha_live"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
      - "59001:9001"

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/profile-photos;
      /usr/bin/mc mb --ignore-existing local/message-attachments;
      /usr/bin/mc mb --ignore-existing local/vibe-media;
      "
